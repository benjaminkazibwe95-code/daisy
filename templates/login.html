<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in · Daisy</title>
<meta name="theme-color" content="#0a0a10" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<link rel="icon" href="/icons/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:      #0a0a10;
    --surface: #14141e;
    --card:    #14141c;
    --border:  rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.16);
    --text:    #f4f4f8;
    --muted:   #8f8c9a;
    --blue:    #7eb8f7;
    --violet:  #a78bfa;
    --red:     #f87171;
    --radius:  16px;
  }
  /* ── follows the phone's system light/dark setting, same colors
       the app itself uses, so this page never looks like a
       different product from the one it signs you into ── */
  @media (prefers-color-scheme: light){
    :root{
      --bg:      #ffffff;
      --surface: #f7f7f5;
      --card:    #f0f0ee;
      --border:  #dcdcd8;
      --border2: #c9c9c4;
      --text:    #17171a;
      --muted:   #67676c;
      --blue:    #1f6fd6;
      --violet:  #7c3aed;
      --red:     #dc2626;
    }
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }

  /* ── ambient waveform: Daisy "listening" for you to sign in ── */
  #pulse-field{
    position:fixed; inset:0; z-index:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0.55; pointer-events:none;
    -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 42%, #000 0%, transparent 72%);
            mask-image: radial-gradient(ellipse 60% 50% at 50% 42%, #000 0%, transparent 72%);
  }
  #pulse-field svg{ width:min(900px, 140vw); height:auto; }
  #pulse-field path{
    fill:none; stroke-width:1.4; stroke-linecap:round;
  }
  #pulse-field .p1{ stroke:var(--blue); opacity:0.9; }
  #pulse-field .p2{ stroke:var(--violet); opacity:0.55; }
  @keyframes breathe{
    0%,100%{ transform:scaleY(1); }
    50%{ transform:scaleY(1.18); }
  }
  #pulse-field svg{ animation:breathe 6.5s ease-in-out infinite; transform-origin:center; }
  @media (prefers-reduced-motion: reduce){
    #pulse-field svg{ animation:none; }
  }

  .wrap{
    position:relative; z-index:1;
    min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 20px 40px;
  }

  .brand{
    display:flex; align-items:center; gap:10px;
    margin-bottom:34px;
  }
  .brand-mark{
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(135deg, var(--blue), var(--violet));
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-word{ font-family:'Instrument Serif', serif; font-size:22px; letter-spacing:0.01em; }
  .brand-word b{ font-weight:400; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:500;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--muted);
    text-align:center; margin-bottom:10px;
  }
  .eyebrow em{ color:var(--blue); font-style:normal; }

  h1{
    font-family:'Instrument Serif', serif; font-weight:400;
    font-size:clamp(28px, 5vw, 36px); line-height:1.12;
    text-align:center; margin:0 0 6px;
  }
  h1 em{
    font-style:italic;
    color:var(--blue);
  }
  .sub{
    text-align:center; color:var(--muted); font-size:14.5px;
    margin:0 0 30px; max-width:340px; line-height:1.5;
  }

  .card{
    width:100%; max-width:380px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:26px;
    box-shadow:0 30px 80px -30px rgba(0,0,0,0.6);
  }

  .google-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:12px 16px; border-radius:11px;
    background:#fff; color:#1a1a1a; border:1px solid rgba(0,0,0,0.06);
    font-family:'Inter',sans-serif; font-size:14.5px; font-weight:600;
    cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
  }
  .google-btn:hover{ box-shadow:0 8px 22px -8px rgba(0,0,0,0.5); transform:translateY(-1px); }
  .google-btn svg{ width:18px; height:18px; }
  #g_id_signin{ display:flex; justify-content:center; }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin:20px 0; color:var(--muted); font-size:12px;
    font-family:'IBM Plex Mono', monospace; letter-spacing:0.08em; text-transform:uppercase;
  }
  .divider::before, .divider::after{
    content:''; flex:1; height:1px; background:var(--border2);
  }

  label{
    display:block; font-size:12.5px; font-weight:500; color:var(--muted);
    margin:0 0 6px; font-family:'Inter',sans-serif;
  }
  .field{ margin-bottom:14px; }
  .field.hidden{ display:none; }
  input[type=text], input[type=email], input[type=password]{
    width:100%; padding:12px 13px; border-radius:11px;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text); font-size:14.5px; font-family:'Inter',sans-serif;
    outline:none; transition:border-color .12s ease;
  }
  input:focus{ border-color:var(--blue); }
  input::placeholder{ color:#5c5966; }

  .submit-btn{
    width:100%; padding:12.5px 16px; border-radius:11px; border:none;
    background:var(--blue);
    color:#0a0a10; font-weight:600; font-size:14.5px; font-family:'Inter',sans-serif;
    cursor:pointer; margin-top:4px;
    transition:opacity .12s ease, transform .12s ease;
  }
  .submit-btn:hover{ opacity:0.92; }
  .submit-btn:active{ transform:scale(0.99); }
  .submit-btn:disabled{ opacity:0.55; cursor:default; }

  .error-msg{
    display:none; align-items:flex-start; gap:8px;
    background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.28);
    color:#fda4a4; font-size:13px; line-height:1.4;
    padding:10px 12px; border-radius:10px; margin-bottom:14px;
  }
  .error-msg.show{ display:flex; }

  .switch-row{
    text-align:center; margin-top:20px; font-size:13.5px; color:var(--muted);
  }
  .switch-row button{
    background:none; border:none; color:var(--blue); font-weight:600;
    font-size:13.5px; cursor:pointer; padding:0; font-family:'Inter',sans-serif;
  }

  .console-note{
    display:none; align-items:center; gap:8px;
    justify-content:center; margin-top:22px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted);
    letter-spacing:0.04em;
  }
  .console-note .dot{ width:6px; height:6px; border-radius:50%; background:var(--violet); }

  footer{
    margin-top:30px; text-align:center; font-size:12px; color:#555260;
    font-family:'Inter',sans-serif;
  }
  footer a{ color:#79768a; text-decoration:underline; text-underline-offset:2px; }
</style>
</head>
<body>

<div id="pulse-field" aria-hidden="true">
  <svg viewBox="0 0 900 160" preserveAspectRatio="none">
    <path class="p2" d="M0,80 L160,80 L185,30 L210,130 L235,55 L258,80 L900,80"/>
    <path class="p1" d="M0,80 L360,80 L390,18 L420,142 L450,45 L480,105 L510,80 L900,80"/>
  </svg>
</div>

<div class="wrap">

  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M2 12h5l2.5-7 4 14 2.5-9 2 2h4" stroke="#0a0a10" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="brand-word">Daisy</div>
  </div>

  <div class="eyebrow" id="eyebrow">Daisy <em>· Made in Uganda</em></div>
  <h1 id="headline">Good to hear <em>from you.</em></h1>
  <p class="sub" id="subhead">Sign in to pick up your chats, memory, and projects wherever you left them.</p>

  <div class="card">

    <div class="error-msg" id="error-msg"></div>

    <div id="g_id_signin"></div>
    <button class="google-btn" id="google-fallback-btn" style="display:none;" type="button">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6.5 29.6 4.5 24 4.5c-7.6 0-14.2 4.3-17.7 10.6z"/><path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4c-2.1 1.5-4.7 2.4-7.6 2.4-5.3 0-9.8-3.4-11.4-8.1l-6.6 5.1C9.7 40.2 16.3 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.4C41.5 35.8 44.5 30.3 44.5 24c0-1.2-.1-2.4-.9-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <form id="auth-form" autocomplete="on">
      <div class="field hidden" id="name-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="What should Daisy call you?" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button class="submit-btn" id="submit-btn" type="submit">Sign in</button>
    </form>

    <div class="switch-row">
      <span id="switch-prompt">New to Daisy?</span>
      <button type="button" id="switch-btn">Create an account</button>
    </div>

  </div>

  <div class="console-note" id="console-note">
    <span class="dot"></span> Console access is limited to admin accounts
  </div>

  <footer>
    By continuing you agree to Daisy's <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.
  </footer>

</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var next = params.get('next') || '/';
  var isConsole = next.indexOf('/console') === 0;

  if (isConsole) {
    document.getElementById('eyebrow').innerHTML = 'Daisy <em>· Developer Console</em>';
    document.getElementById('headline').innerHTML = 'Sign in to the <em>console.</em>';
    document.getElementById('subhead').textContent = 'API keys, webhooks, and integration settings live behind an account.';
    document.getElementById('console-note').style.display = 'flex';
  }

  var mode = 'login'; // or 'signup'
  var form = document.getElementById('auth-form');
  var nameField = document.getElementById('name-field');
  var submitBtn = document.getElementById('submit-btn');
  var switchBtn = document.getElementById('switch-btn');
  var switchPrompt = document.getElementById('switch-prompt');
  var errorBox = document.getElementById('error-msg');
  var pwInput = document.getElementById('password');

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError(){
    errorBox.classList.remove('show');
    errorBox.textContent = '';
  }

  switchBtn.addEventListener('click', function(){
    clearError();
    if (mode === 'login') {
      mode = 'signup';
      nameField.classList.remove('hidden');
      submitBtn.textContent = 'Create account';
      switchPrompt.textContent = 'Already have an account?';
      switchBtn.textContent = 'Sign in';
      pwInput.setAttribute('autocomplete', 'new-password');
      pwInput.setAttribute('placeholder', 'At least 8 characters');
    } else {
      mode = 'login';
      nameField.classList.add('hidden');
      submitBtn.textContent = 'Sign in';
      switchPrompt.textContent = 'New to Daisy?';
      switchBtn.textContent = 'Create an account';
      pwInput.setAttribute('autocomplete', 'current-password');
      pwInput.setAttribute('placeholder', '••••••••');
    }
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    clearError();
    submitBtn.disabled = true;
    var prevLabel = submitBtn.textContent;
    submitBtn.textContent = mode === 'login' ? 'Signing in…' : 'Creating account…';

    var payload = {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    };
    if (mode === 'signup') payload.name = document.getElementById('name').value.trim();

    fetch('/auth/' + (mode === 'login' ? 'login' : 'signup'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
    .then(function(res){
      if (!res.ok) {
        showError(res.data.error || 'Something went wrong. Try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = prevLabel;
        return;
      }
      window.location.href = next;
    })
    .catch(function(){
      showError('Couldn\'t reach Daisy. Check your connection and try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = prevLabel;
    });
  });

  function sendGoogleCredential(credential){
    clearError();
    fetch('/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: credential })
    })
    .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
    .then(function(res){
      if (!res.ok) { showError(res.data.error || 'Google sign-in failed.'); return; }
      window.location.href = next;
    })
    .catch(function(){ showError('Couldn\'t reach Daisy. Check your connection and try again.'); });
  }

  var GOOGLE_CLIENT_ID = {{ google_client_id | tojson }};

  if (GOOGLE_CLIENT_ID) {
    window.addEventListener('load', function(){
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: function(response){ sendGoogleCredential(response.credential); }
        });
        google.accounts.id.renderButton(
          document.getElementById('g_id_signin'),
          { theme: 'filled_black', size: 'large', width: 328, shape: 'pill', text: 'continue_with' }
        );
      } else {
        document.getElementById('google-fallback-btn').style.display = 'flex';
      }
    });
  } else {
    document.getElementById('g_id_signin').style.display = 'none';
  }
})();
</script>

</body>
</html>
